<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的名片</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: #e2e8f0;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
    backdrop-filter: blur(12px);
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 700;
    color: #fff;
  }
  h1 { font-size: 26px; margin-bottom: 8px; }
  .bio { color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .tag {
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.15);
    color: #7dd3fc;
    font-size: 14px;
  }
  .contact {
    display: block;
    padding: 12px;
    border-radius: 12px;
    background: #38bdf8;
    color: #0f172a;
    text-decoration: none;
    font-weight: 600;
  }
  .contact:hover { background: #7dd3fc; }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">我</div>
    <h1>你的名字</h1>
    <p class="bio">一句话介绍自己：正在学习用 AI 写代码的人。</p>
    <div class="tags">
      <span class="tag">设计</span>
      <span class="tag">摄影</span>
      <span class="tag">Vibe Coding</span>
    </div>
    <a class="contact" href="mailto:you@example.com">联系我</a>
  </main>
</body>
</html>
